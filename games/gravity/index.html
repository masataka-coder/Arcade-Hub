<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gravity Shift Lab</title>
    <style>
        :root {
            --bg-dark: #0f1016;
            --neon-blue: #00f3ff;
            --neon-pink: #ff007f;
            --neon-yellow: #ffea00;
            --neon-purple: #8b5cf6;
            --text-light: #e2e8f0;
            --panel-bg: rgba(15, 16, 22, 0.85);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-light);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
        }

        #bg-grid {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image:
                linear-gradient(rgba(0, 243, 255, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 243, 255, 0.05) 1px, transparent 1px);
            background-size: 50px 50px;
            z-index: 0;
            pointer-events: none;
        }

        canvas {
            display: block;
            position: absolute;
            top: 0; left: 0;
            z-index: 1;
        }

        #ui-layer {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: 10;
        }

        .screen {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: var(--panel-bg);
            backdrop-filter: blur(8px);
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease;
            pointer-events: auto;
        }

        .screen.active {
            opacity: 1;
            visibility: visible;
        }

        h1 {
            font-size: 4rem;
            color: #fff;
            text-shadow: 0 0 10px var(--neon-blue), 0 0 20px var(--neon-blue), 0 0 40px var(--neon-blue);
            margin-bottom: 20px;
            font-weight: 900;
            text-align: center;
            letter-spacing: 2px;
        }

        .subtitle {
            font-size: 1.2rem;
            margin-bottom: 40px;
            color: var(--neon-yellow);
            text-shadow: 0 0 5px var(--neon-yellow);
            text-align: center;
            line-height: 1.6;
        }

        .btn {
            background: transparent;
            color: #fff;
            border: 2px solid var(--neon-blue);
            padding: 15px 40px;
            font-size: 1.5rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 0 10px var(--neon-blue) inset, 0 0 10px var(--neon-blue);
            margin: 10px;
            text-transform: uppercase;
            letter-spacing: 2px;
            pointer-events: auto;
        }

        .btn:hover {
            background: var(--neon-blue);
            color: var(--bg-dark);
            box-shadow: 0 0 20px var(--neon-blue) inset, 0 0 20px var(--neon-blue);
            transform: scale(1.05);
        }

        .btn.pink {
            border-color: var(--neon-pink);
            box-shadow: 0 0 10px var(--neon-pink) inset, 0 0 10px var(--neon-pink);
        }

        .btn.pink:hover {
            background: var(--neon-pink);
            box-shadow: 0 0 20px var(--neon-pink) inset, 0 0 20px var(--neon-pink);
        }

        /* HUD */
        #hud {
            position: absolute;
            top: 0; left: 0;
            width: 100%;
            padding: 20px 30px;
            display: flex;
            justify-content: space-between;
            font-size: 1.5rem;
            font-weight: bold;
            text-shadow: 0 0 5px rgba(255,255,255,0.5);
            pointer-events: none;
        }

        .hud-left { color: var(--neon-blue); text-shadow: 0 0 10px var(--neon-blue); }
        .hud-right { color: var(--neon-yellow); text-shadow: 0 0 10px var(--neon-yellow); }

        /* Shop */
        .shop-container {
            display: flex;
            gap: 20px;
            max-width: 900px;
            flex-wrap: wrap;
            justify-content: center;
            margin-bottom: 30px;
        }

        .shop-item {
            border: 2px solid var(--neon-purple);
            border-radius: 8px;
            padding: 20px;
            background: rgba(139, 92, 246, 0.1);
            width: 260px;
            text-align: center;
            box-shadow: 0 0 15px var(--neon-purple);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .shop-item h3 {
            color: var(--neon-purple);
            text-shadow: 0 0 5px var(--neon-purple);
            margin-bottom: 10px;
            font-size: 1.5rem;
        }

        .shop-item p {
            font-size: 0.95rem;
            margin-bottom: 15px;
            color: #cbd5e1;
        }

        .shop-item .price {
            color: var(--neon-yellow);
            font-weight: bold;
            margin-bottom: 15px;
            font-size: 1.2rem;
            text-shadow: 0 0 5px var(--neon-yellow);
        }

        .shop-btn {
            background: transparent;
            color: #fff;
            border: 1px solid var(--neon-purple);
            padding: 10px 20px;
            cursor: pointer;
            border-radius: 4px;
            transition: 0.2s;
            font-weight: bold;
            text-transform: uppercase;
            box-shadow: 0 0 5px var(--neon-purple) inset;
        }

        .shop-btn:hover:not(:disabled) {
            background: var(--neon-purple);
            color: #fff;
            box-shadow: 0 0 15px var(--neon-purple);
        }

        .shop-btn:disabled {
            border-color: #555;
            color: #555;
            background: rgba(255,255,255,0.05);
            cursor: not-allowed;
            box-shadow: none;
        }

        /* Controls Info */
        .controls-info {
            display: flex;
            gap: 20px;
            margin-top: 20px;
            background: rgba(0,0,0,0.5);
            padding: 15px 30px;
            border-radius: 8px;
            border: 1px solid var(--neon-blue);
            box-shadow: 0 0 10px rgba(0, 243, 255, 0.2);
        }

        .ctrl-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 1rem;
            font-weight: bold;
            color: var(--neon-blue);
        }

        .key-badge {
            background: var(--neon-blue);
            padding: 4px 10px;
            border-radius: 4px;
            font-weight: bold;
            color: var(--bg-dark);
        }

        @media (max-width: 600px) {
            h1 { font-size: 2.5rem; }
            .btn { font-size: 1.2rem; padding: 12px 24px; }
            #hud { font-size: 1.2rem; padding: 10px 15px; }
            .shop-item { width: 100%; max-width: 300px; }
            .controls-info { flex-direction: column; gap: 10px; }
        }
    </style>
</head>
<body>
    <div id="bg-grid"></div>
    <canvas id="gameCanvas"></canvas>

    <div id="ui-layer">
        <!-- In-Game HUD -->
        <div id="hud" style="display: none;">
            <div class="hud-left">Distance: <span id="distVal">0</span>m</div>
            <div class="hud-right">Energy: <span id="energyVal">0</span> ⚡</div>
        </div>

        <button id="topBtn" class="btn" style="display: none; position: absolute; top: 10px; left: 50%; transform: translateX(-50%); padding: 5px 15px; font-size: 1rem; z-index: 100;" onclick="quitGame()">QUIT</button>

        <!-- Start Screen -->
        <div id="startScreen" class="screen active">
            <h1>GRAVITY SHIFT<br>LAB</h1>
            <div class="subtitle">
                重力を反転させ、障害物を避けて進め。<br>
                集めたエネルギーで機体をアップグレード可能。
            </div>
            <div style="display: flex; gap: 15px; flex-wrap: wrap; justify-content: center;">
                <button class="btn" onclick="startGame()">SYSTEM BOOT</button>
                <button class="btn pink" onclick="showShop()">UPGRADES</button>
                <button class="btn" style="border-color: #cbd5e1; box-shadow: 0 0 10px rgba(203,213,225,0.5) inset, 0 0 10px rgba(203,213,225,0.5); color: #cbd5e1;" onclick="location.href='../../index.html'">TOP</button>
            </div>
            
            <div class="controls-info">
                <div class="ctrl-item"><span class="key-badge">Space</span> 重力反転</div>
                <div class="ctrl-item"><span class="key-badge">Click / Tap</span> 重力反転</div>
            </div>
        </div>

        <!-- Game Over Screen -->
        <div id="gameoverScreen" class="screen">
            <h1 style="color: var(--neon-pink); text-shadow: 0 0 10px var(--neon-pink), 0 0 20px var(--neon-pink), 0 0 40px var(--neon-pink);">CRITICAL FAILURE</h1>
            <div class="subtitle" id="resultText">
                生存距離: 0m <br>
                獲得エネルギー: 0 ⚡
            </div>
            <div style="display: flex; gap: 15px; flex-wrap: wrap; justify-content: center;">
                <button class="btn" onclick="showStartScreen()">REBOOT</button>
                <button class="btn pink" onclick="showShop()">UPGRADES</button>
            </div>
        </div>

        <!-- Shop Screen -->
        <div id="shopScreen" class="screen">
            <h1 style="color: var(--neon-purple); text-shadow: 0 0 10px var(--neon-purple), 0 0 20px var(--neon-purple);">LAB UPGRADES</h1>
            <div class="subtitle" style="color: #fff; text-shadow: none;">
                Total Energy: <span id="shopEnergyVal" style="font-size: 1.8rem; color: var(--neon-yellow); text-shadow: 0 0 10px var(--neon-yellow); font-weight: bold;">0</span> ⚡
            </div>
            
            <div class="shop-container" id="shopContainer">
                <!-- Dynamically populated -->
            </div>
            
            <button class="btn" style="border-color: #cbd5e1; color: #cbd5e1; box-shadow: 0 0 10px rgba(203,213,225,0.5) inset;" onclick="showStartScreen()">BACK</button>
        </div>
    </div>

    <script>
        // --- System Setup --- //
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const bgGrid = document.getElementById('bg-grid');
        let width, height;

        function resizePlayer() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
        }
        window.addEventListener('resize', resizePlayer);
        resizePlayer();

        // --- Game States --- //
        const STATE = { MENU: 0, PLAYING: 1, GAMEOVER: 2, SHOP: 3 };
        let currentState = STATE.MENU;

        // --- Save Data / Upgrades --- //
        let bankEnergy = parseInt(localStorage.getItem('gravity_energy') || 20); // Initial bonus
        let upgrades = JSON.parse(localStorage.getItem('gravity_upgrades') || JSON.stringify({
            shield: 0,
            magnet: 0,
            multiplier: 0
        }));

        const UPGRADE_DATA = {
            shield: {
                name: "プラズマシールド",
                desc: "障害物に衝突した際、ダメージを無効化する回数を追加",
                baseCost: 50,
                maxLevel: 3
            },
            magnet: {
                name: "磁気フィールド",
                desc: "周囲のエネルギーコアを自動的に引き寄せる",
                baseCost: 30,
                maxLevel: 5
            },
            multiplier: {
                name: "高効率コンバータ",
                desc: "エネルギー取得時の獲得量がアップする",
                baseCost: 100,
                maxLevel: 5
            }
        };

        function saveGame() {
            localStorage.setItem('gravity_energy', bankEnergy);
            localStorage.setItem('gravity_upgrades', JSON.stringify(upgrades));
        }

        // --- Entities & Variables --- //
        let player = {
            x: 0, y: 0,
            size: 24,
            vy: 0,
            gravity: 0.5,
            inverted: false,
            shieldsLeft: 0,
            dead: false
        };

        let obstacles = [];
        let edges = []; // Top/Bottom solid blocks
        let gems = [];
        let particles = [];
        let floatingTexts = [];

        let gameSpeed = 5; // Base speed, scales over time
        let bgOffset = 0;
        let distance = 0;
        let runEnergy = 0;
        let chunkTimer = 0;
        
        let lastTime = 0;
        let reqId;

        // Colors
        const COL_BG = '#0f1016';
        const COL_PLAYER = '#00f3ff';
        const COL_PLAYER_INV = '#ff007f';
        const COL_OBSTACLE = '#ef4444'; // Red
        const COL_GEM = '#ffea00';
        const COL_SHIELD = '#22c55e'; // Green

        // --- Input --- //
        function toggleGravity() {
            if (currentState === STATE.PLAYING && !player.dead) {
                player.inverted = !player.inverted;
                player.vy = 0; // Reset velocity on flip for crisp feel
                
                // Jump visual effect
                createParticles(player.x, player.y + (player.inverted ? player.size/2 : -player.size/2), 
                               player.inverted ? COL_PLAYER_INV : COL_PLAYER, 10, 4);
            }
        }

        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space') {
                e.preventDefault();
                toggleGravity();
            }
        });

        // Click / Touch outside of UI buttons
        window.addEventListener('mousedown', (e) => {
            if (e.target.tagName !== 'BUTTON' && e.target.closest('.screen') === null || e.target.id === 'hud') {
                toggleGravity();
            }
        });
        
        window.addEventListener('touchstart', (e) => {
            if (e.target.tagName !== 'BUTTON' && e.target.closest('.screen') === null || e.target.id === 'hud') {
                e.preventDefault(); // Prevent double triggering with mousedown
                toggleGravity();
            }
        }, {passive: false});

        // --- Core Functions --- //
        function resetGame() {
            player.x = width * 0.2;
            player.y = height / 2;
            player.vy = 0;
            player.inverted = false;
            player.dead = false;
            player.shieldsLeft = upgrades.shield;

            obstacles = [];
            edges = [];
            gems = [];
            particles = [];
            floatingTexts = [];
            
            // Generate initial clear zone
            edges.push({x: 0, y: 0, w: width * 2, h: 40, type: 'edge'});
            edges.push({x: 0, y: height - 40, w: width * 2, h: 40, type: 'edge'});

            gameSpeed = 6 + (width / 500); // Scale initial speed slightly by screen size
            distance = 0;
            runEnergy = 0;
            chunkTimer = width;

            bgOffset = 0;
            updateHud();
        }

        function createParticles(x, y, color, count, speedScale) {
            for (let i = 0; i < count; i++) {
                particles.push({
                    x: x, y: y,
                    vx: (Math.random() - 0.5) * speedScale * 2,
                    vy: (Math.random() - 0.5) * speedScale * 2,
                    life: 1.0,
                    color: color,
                    size: Math.random() * 4 + 2
                });
            }
        }
        
        function createFloatingText(x, y, text, color) {
            floatingTexts.push({
                x: x, y: y,
                vy: -2,
                life: 1.0,
                text: text,
                color: color
            });
        }

        // --- Level Generation --- //
        function generateChunk() {
            const startX = width + 50;
            const gapH = player.size * 9; // Made gap wider for better playability
            const centerY = height / 2;
            
            // Extended edges
            edges.push({x: startX - 100, y: 0, w: width + 200, h: 40, type: 'edge'});
            edges.push({x: startX - 100, y: height - 40, w: width + 200, h: 40, type: 'edge'});

            // Difficulty scales with distance
            let diffMode = Math.min(Math.floor(distance / 500), 4);
            
            const patterns = [
                // 0: Basic tunnel with gems
                () => {
                    let yShift = (Math.random() - 0.5) * height * 0.4;
                    let tunnelY = centerY + yShift;
                    // Clamp to make sure gap is within playable area
                    tunnelY = Math.max(40 + gapH/2, Math.min(height - 40 - gapH/2, tunnelY)); 

                    obstacles.push({x: startX, y: 40, w: 200, h: tunnelY - gapH/2 - 40});
                    obstacles.push({x: startX, y: tunnelY + gapH/2, w: 200, h: height - (tunnelY + gapH/2) - 40});
                    
                    gems.push({x: startX + 100, y: tunnelY});
                    gems.push({x: startX + 130, y: tunnelY});
                },
                // 1: Spikes on floor/ceiling alternating
                () => {
                    // Increased x spacing between spikes to allow easier flipping
                    obstacles.push({x: startX, y: height - 40 - 60, w: 80, h: 60, type: 'spike'});
                    obstacles.push({x: startX + 350, y: 40, w: 80, h: 60, type: 'spike'});
                    
                    gems.push({x: startX + 175, y: centerY}); // Placed center gem smoothly
                    gems.push({x: startX + 430, y: centerY});
                },
                // 2: Middle wall
                () => {
                    let wallH = Math.min(200, height * 0.4); // Responsive height
                    obstacles.push({x: startX + 100, y: centerY - wallH/2, w: 50, h: wallH});
                    gems.push({x: startX + 50, y: centerY - wallH/2 - 40});
                    gems.push({x: startX + 50, y: centerY + wallH/2 + 40});
                },
                // 3: Laser gate (half screen)
                () => {
                    let isTop = Math.random() > 0.5;
                    let laserH = (height - 80) * 0.55; // Covers 55%, leaves 45% safe gap
                    obstacles.push({
                        x: startX, 
                        y: isTop ? 40 : height - 40 - laserH, 
                        w: 20, 
                        h: laserH, 
                        type: 'laser'
                    });
                    // Put a gem in the safe area
                    gems.push({x: startX + 100, y: isTop ? height - 40 - laserH/2 : 40 + laserH/2});
                }
            ];

            // Pick pattern based on difficulty
            let maxPattern = diffMode >= 3 ? patterns.length : (diffMode >= 1 ? 3 : 2);
            let pick = Math.floor(Math.random() * maxPattern);
            
            patterns[pick]();
            
            chunkTimer = 400 + Math.random() * 300;
        }

        // --- Main Loop --- //
        function loop(timestamp) {
            if (!lastTime) lastTime = timestamp;
            const dt = (timestamp - lastTime) / 1000;
            // Cap dt to prevent massive jumps if tab is inactive
            const safeDt = Math.min(dt, 0.1);
            lastTime = timestamp;

            if (currentState === STATE.PLAYING) {
                updateGame(safeDt);
            }
            drawGame();

            reqId = requestAnimationFrame(loop);
        }

        function updateGame(dt) {
            if (player.dead) return; // Wait for game over screen

            // Player Physics
            let g = player.inverted ? -player.gravity : player.gravity;
            // Gravity easing for smoother flips
            player.vy += g * (dt * 60); 
            
            // Terminal velocity
            if (player.vy > 15) player.vy = 15;
            if (player.vy < -15) player.vy = -15;

            player.y += player.vy;

            // Bounds (Floor / Ceiling edges are 40px thick)
            if (player.y < 40 + player.size/2) {
                player.y = 40 + player.size/2;
                player.vy = 0;
            }
            if (player.y > height - 40 - player.size/2) {
                player.y = height - 40 - player.size/2;
                player.vy = 0;
            }

            // Move World
            let currentSpeed = gameSpeed * (dt * 60);
            distance += currentSpeed;
            gameSpeed += dt * 0.05; // Continual acceleration

            bgOffset = (bgOffset - currentSpeed) % 50;
            bgGrid.style.backgroundPosition = `${bgOffset}px 0`;

            chunkTimer -= currentSpeed;
            if (chunkTimer <= 0) {
                generateChunk();
            }

            // Edge Management
            for (let i = edges.length - 1; i >= 0; i--) {
                edges[i].x -= currentSpeed;
                if (edges[i].x + edges[i].w < 0) {
                    edges.splice(i, 1);
                }
            }

            // Player AABB
            let px1 = player.x - player.size/2 + 4; // slight leeway
            let px2 = player.x + player.size/2 - 4;
            let py1 = player.y - player.size/2 + 4;
            let py2 = player.y + player.size/2 - 4;

            // Obstacles
            for (let i = obstacles.length - 1; i >= 0; i--) {
                let obs = obstacles[i];
                obs.x -= currentSpeed;

                // Collision
                if (px1 < obs.x + obs.w && px2 > obs.x && py1 < obs.y + obs.h && py2 > obs.y) {
                    // Hit
                    if (player.shieldsLeft > 0) {
                        player.shieldsLeft--;
                        createParticles(player.x, player.y, COL_SHIELD, 30, 8);
                        createFloatingText(player.x, player.y - 30, "SHIELD BREAK!", COL_SHIELD);
                        // Destroy obstacle
                        obstacles.splice(i, 1);
                        continue;
                    } else {
                        triggerGameOver();
                        return;
                    }
                }

                if (obs.x + obs.w < -100) obstacles.splice(i, 1);
            }

            // Gems
            let magnetRange = upgrades.magnet * 80; // Level 1=80, Level 5=400
            for (let i = gems.length - 1; i >= 0; i--) {
                let gem = gems[i];
                gem.x -= currentSpeed;

                // Magnet effect
                if (magnetRange > 0) {
                    let dx = player.x - gem.x;
                    let dy = player.y - gem.y;
                    let dist = Math.sqrt(dx*dx + dy*dy);
                    if (dist < magnetRange) {
                        gem.x += dx * 0.1;
                        gem.y += dy * 0.1;
                    }
                }

                // Collect
                let dx = player.x - gem.x;
                let dy = player.y - gem.y;
                if (dx*dx + dy*dy < (player.size + 15)*(player.size + 15)) {
                    // Calculate value
                    let multi = 1 + (upgrades.multiplier * 0.25);
                    let val = Math.ceil(1 * multi);
                    
                    runEnergy += val;
                    bankEnergy += val;
                    
                    createParticles(gem.x, gem.y, COL_GEM, 10, 3);
                    createFloatingText(gem.x, gem.y - 10, `+${val}⚡`, COL_GEM);
                    
                    gems.splice(i, 1);
                    if (Math.floor(distance) % 5 === 0) updateHud(); // throttled save basically
                    continue;
                }

                if (gem.x < -50) gems.splice(i, 1);
            }

            // Particles
            for(let i=particles.length-1; i>=0; i--) {
                particles[i].x += particles[i].vx;
                particles[i].y += particles[i].vy;
                particles[i].x -= currentSpeed * 0.2; // world scroll drift
                particles[i].life -= dt * 2;
                if(particles[i].life <= 0) particles.splice(i, 1);
            }
            
            // Texts
            for(let i=floatingTexts.length-1; i>=0; i--) {
                floatingTexts[i].y += floatingTexts[i].vy;
                floatingTexts[i].life -= dt * 1.5;
                if(floatingTexts[i].life <= 0) floatingTexts.splice(i, 1);
            }

            // Player Trail
            if (Math.random() < 0.4) {
                let pColor = player.shieldsLeft > 0 ? COL_SHIELD : (player.inverted ? COL_PLAYER_INV : COL_PLAYER);
                particles.push({
                    x: player.x - player.size/2,
                    y: player.y,
                    vx: -currentSpeed * 0.5,
                    vy: 0,
                    life: 0.8,
                    color: pColor,
                    size: player.size * 0.8
                });
            }

            updateHud();
        }

        function drawGame() {
            // Background is handled by CSS mostly, but we clear canvas
            ctx.clearRect(0, 0, width, height);

            if (currentState === STATE.MENU || currentState === STATE.SHOP) {
                // Just draw a neat static block behind menu
                ctx.fillStyle = 'rgba(0, 243, 255, 0.05)';
                ctx.fillRect(width/2 - 50, height/2 - 50, 100, 100);
                return;
            }

            // Draw Edges (Ceiling/Floor)
            ctx.fillStyle = 'rgba(0, 243, 255, 0.1)';
            ctx.shadowBlur = 10;
            ctx.shadowColor = COL_PLAYER;
            edges.forEach(e => {
                ctx.fillRect(e.x, e.y, e.w, e.h);
                // Lower edge border
                ctx.fillStyle = COL_PLAYER;
                ctx.fillRect(e.x, e.y === 0 ? e.h - 2 : e.y, e.w, 2);
            });

            // Draw Obstacles
            obstacles.forEach(obs => {
                if (obs.type === 'spike') {
                    ctx.shadowColor = COL_OBSTACLE;
                    ctx.fillStyle = 'rgba(239, 68, 68, 0.2)';
                    ctx.strokeStyle = COL_OBSTACLE;
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    if (obs.y < height / 2) {
                        // Pointing down
                        ctx.moveTo(obs.x, obs.y);
                        ctx.lineTo(obs.x + obs.w/2, obs.y + obs.h);
                        ctx.lineTo(obs.x + obs.w, obs.y);
                    } else {
                        // Pointing up
                        ctx.moveTo(obs.x, obs.y + obs.h);
                        ctx.lineTo(obs.x + obs.w/2, obs.y);
                        ctx.lineTo(obs.x + obs.w, obs.y + obs.h);
                    }
                    ctx.closePath();
                    ctx.fill();
                    ctx.stroke();
                } else if (obs.type === 'laser') {
                    ctx.shadowColor = COL_OBSTACLE;
                    ctx.fillStyle = COL_OBSTACLE;
                    // Pulsing laser
                    let pulse = Math.sin(Date.now() / 100) * 0.5 + 0.5;
                    ctx.globalAlpha = 0.5 + pulse * 0.5;
                    ctx.fillRect(obs.x, obs.y, obs.w, obs.h);
                    ctx.globalAlpha = 1.0;
                } else {
                    // Standard block
                    ctx.shadowColor = '#fff';
                    ctx.fillStyle = 'rgba(255, 255, 255, 0.1)';
                    ctx.strokeStyle = 'rgba(255, 255, 255, 0.5)';
                    ctx.lineWidth = 2;
                    ctx.fillRect(obs.x, obs.y, obs.w, obs.h);
                    ctx.strokeRect(obs.x, obs.y, obs.w, obs.h);
                    
                    // X pattern
                    ctx.beginPath();
                    ctx.moveTo(obs.x, obs.y); ctx.lineTo(obs.x+obs.w, obs.y+obs.h);
                    ctx.moveTo(obs.x+obs.w, obs.y); ctx.lineTo(obs.x, obs.y+obs.h);
                    ctx.stroke();
                }
            });

            // Draw Gems
            ctx.shadowColor = COL_GEM;
            ctx.shadowBlur = 15;
            gems.forEach(g => {
                ctx.save();
                ctx.translate(g.x, g.y);
                ctx.rotate(Date.now() / 500);
                
                ctx.fillStyle = COL_GEM;
                ctx.beginPath();
                ctx.moveTo(0, -10);
                ctx.lineTo(8, 0);
                ctx.lineTo(0, 10);
                ctx.lineTo(-8, 0);
                ctx.closePath();
                ctx.fill();
                
                ctx.fillStyle = '#fff';
                ctx.beginPath();
                ctx.arc(0, 0, 3, 0, Math.PI*2);
                ctx.fill();
                ctx.restore();
            });

            // Draw Particles
            particles.forEach(p => {
                ctx.shadowColor = p.color;
                ctx.shadowBlur = 10;
                ctx.fillStyle = p.color;
                ctx.globalAlpha = Math.max(0, p.life);
                if (p.size > 0) {
                    ctx.fillRect(p.x - p.size/2, p.y - p.size/2, p.size, p.size);
                }
            });
            ctx.globalAlpha = 1.0;

            // Draw Player
            if (!player.dead) {
                let pColor = player.inverted ? COL_PLAYER_INV : COL_PLAYER;
                ctx.shadowColor = pColor;
                ctx.shadowBlur = 20;

                ctx.save();
                ctx.translate(player.x, player.y);
                
                // Rotation based on vertical velocity
                ctx.rotate(player.vy * 0.05);

                // Shield visual
                if (player.shieldsLeft > 0) {
                    ctx.shadowColor = COL_SHIELD;
                    ctx.strokeStyle = COL_SHIELD;
                    ctx.lineWidth = 3;
                    ctx.beginPath();
                    ctx.arc(0, 0, player.size * 0.8 + Math.sin(Date.now()/100)*2, 0, Math.PI*2);
                    ctx.stroke();
                }

                // Body
                ctx.fillStyle = '#fff';
                ctx.fillRect(-player.size/2, -player.size/2, player.size, player.size);
                
                // Direction Eye
                ctx.fillStyle = pColor;
                ctx.fillRect(player.size/4 - 2, player.inverted ? -player.size/2 + 2 : player.size/4, 6, player.size/4);

                ctx.restore();
            }

            // Draw Floating Texts
            ctx.shadowBlur = 5;
            ctx.font = "bold 20px 'Segoe UI', sans-serif";
            floatingTexts.forEach(ft => {
                ctx.shadowColor = ft.color;
                ctx.fillStyle = ft.color;
                ctx.globalAlpha = Math.max(0, ft.life);
                ctx.fillText(ft.text, ft.x, ft.y);
            });
            ctx.globalAlpha = 1.0;
            ctx.shadowBlur = 0;
        }

        // --- Flow Control --- //
        function triggerGameOver() {
            player.dead = true;
            createParticles(player.x, player.y, COL_OBSTACLE, 50, 15);
            createParticles(player.x, player.y, '#fff', 20, 10);
            
            saveGame(); // Save collected energy

            setTimeout(() => {
                currentState = STATE.GAMEOVER;
                hideAllScreens();
                document.getElementById('hud').style.display = 'none';
                document.getElementById('topBtn').style.display = 'none';
                
                document.getElementById('gameoverScreen').classList.add('active');
                
                document.getElementById('resultText').innerHTML = 
                    `到達距離: <span style="color:var(--neon-blue)">${Math.floor(distance / 10)}</span> m<br>` +
                    `獲得エネルギー: <span style="color:var(--neon-yellow)">${runEnergy}</span> ⚡`;

            }, 1000);
        }

        function updateHud() {
            document.getElementById('distVal').innerText = Math.floor(distance / 10);
            document.getElementById('energyVal').innerText = runEnergy;
        }

        function hideAllScreens() {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        }

        function startGame() {
            currentState = STATE.PLAYING;
            hideAllScreens();
            document.getElementById('hud').style.display = 'flex';
            document.getElementById('topBtn').style.display = 'block';
            resetGame();
        }

        function quitGame() {
            // Trigger game over manually
            triggerGameOver();
        }

        function showStartScreen() {
            currentState = STATE.MENU;
            hideAllScreens();
            document.getElementById('hud').style.display = 'none';
            document.getElementById('topBtn').style.display = 'none';
            document.getElementById('startScreen').classList.add('active');
        }

        // --- Shop logic --- //
        function showShop() {
            currentState = STATE.SHOP;
            hideAllScreens();
            document.getElementById('hud').style.display = 'none';
            document.getElementById('topBtn').style.display = 'none';
            document.getElementById('shopScreen').classList.add('active');
            
            renderShop();
        }

        function renderShop() {
            document.getElementById('shopEnergyVal').innerText = bankEnergy;
            const container = document.getElementById('shopContainer');
            container.innerHTML = '';
            
            for (let key in UPGRADE_DATA) {
                let d = UPGRADE_DATA[key];
                let lvl = upgrades[key];
                let cost = Math.floor(d.baseCost * Math.pow(1.5, lvl));
                let isMax = lvl >= d.maxLevel;
                
                let div = document.createElement('div');
                div.className = 'shop-item';
                div.innerHTML = `
                    <div>
                        <h3>${d.name}</h3>
                        <p>${d.desc}</p>
                        <p style="color:#a8b2d1; margin-bottom: 5px;">Level: 
                            <span style="color:var(--neon-blue); font-weight:bold;">${lvl}</span> / ${d.maxLevel}
                        </p>
                    </div>
                    <div>
                        ${isMax 
                            ? '<div class="price" style="color:#aaa; text-shadow:none;">MAX LEVEL REACHED</div>' 
                            : `<div class="price">コスト: ${cost} ⚡</div>`
                        }
                        <button class="shop-btn" ${isMax || bankEnergy < cost ? 'disabled' : ''} onclick="buyUpgrade('${key}')">
                            ${isMax ? 'MAXED' : (bankEnergy >= cost ? 'UPGRADE' : 'エネルギー不足')}
                        </button>
                    </div>
                `;
                container.appendChild(div);
            }
        }

        window.buyUpgrade = function(key) {
            let d = UPGRADE_DATA[key];
            let lvl = upgrades[key];
            let cost = Math.floor(d.baseCost * Math.pow(1.5, lvl));
            
            if (bankEnergy >= cost && lvl < d.maxLevel) {
                bankEnergy -= cost;
                upgrades[key]++;
                saveGame();
                renderShop();
                
                // Visual feedback
                const el = document.getElementById('shopEnergyVal');
                el.style.color = '#fff';
                setTimeout(() => el.style.color = 'var(--neon-yellow)', 200);
            }
        }

        // Init
        requestAnimationFrame(loop);

    </script>
</body>
</html>
